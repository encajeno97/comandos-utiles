<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="auth.css" />
    <title>Authentication</title>
  </head>
  <body>
    <header class="header">
      <a href="devjob.html">
        <span>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M17.25 6.75 22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3-4.5 16.5"
            />
          </svg>
          DevJobs
        </span>
      </a>
      <nav class="nav">
        <ul>
          <li><a href="index.html">Buscar</a></li>
          <li><a href="receta.html">Empresas</a></li>
          <li><a href="salarios.html">Acerca de</a></li>
        </ul>
      </nav>

      <div class="link-container">
        <a href="">Publicar un empleo</a>
        <a href="">Iniciar sesión</a>
      </div>
      <div class="icon-container">
        <div class="search-icon">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-search-icon lucide-search"
          >
            <path d="m21 21-4.34-4.34" />
            <circle cx="11" cy="11" r="8" />
          </svg>
        </div>
        <button class="menu-button" aria-label="Menu">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M3.75 9h16.5m-16.5 6.75h16.5"
            />
          </svg>
        </button>
      </div>
    </header>
    <main>
      <div class="container">
        <h1>Welcome Back</h1>
        <p>Log in to find your next opportunity.</p>
        <section>
          <div class="form-container">
            <form action="">
              <input type="email" placeholder="Email" required />
              <input
                type="password"
                placeholder="Password"
                required
                minlength="8"
              />
              <div class="form-options">
                <div class="remember-me">
                  <input type="checkbox" id="remember-me" />
                  <label for="remember-me">Remember me</label>
                </div>
                <a href="">Forgot password?</a>
              </div>
              <button type="submit" class="btn-submit">Log in</button>
            </form>
            <div>
              <a id="link-account" href="">Don't have an account?</a>
            </div>
            <div class="sign-up-links">
              <a href="">Sign up as a developer</a>
              <a href="">Sign up as a company</a>
            </div>
          </div>
        </section>
      </div>
    </main>
    <footer>
      <p>&copy; 2025 DevJobs. Todos los derechos reservados.</p>
    </footer>
  </body>
</html>
