<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="devjobs.css" />
    <title>DevJobs</title>
  </head>
  <body>
    <header class="header">
      <div>
        <span>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M17.25 6.75 22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3-4.5 16.5"
            />
          </svg>
          DevJobs
        </span>
      </div>
      <nav class="nav">
        <ul>
          <li><a href="index.html">Buscar</a></li>
          <li><a href="receta.html">Empleos</a></li>
          <li><a href="salarios.html">Empresas</a></li>
          <li><a href="contacto.html">Salarios</a></li>
        </ul>
      </nav>
      <div class="link-container">
        <a href="">Publicar un empleo</a>
        <a href="">Iniciar sesión</a>
      </div>
    </header>
    <main>
      <div class="hero-container">
        <img
          src="./background.webp"
          alt="Grupo de desarrolladores con el portatil trabajando"
        />
        <div class="hero-text">
          <h1>Encuentra el trabajo de tus sueños</h1>
          <p>
            Únete a nuestra comunidad mas grande de desarroladores y encuentra
            tu proxima oportunidad.
          </p>
          <div class="search-box">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"
              />
            </svg>

            <input
              type="text"
              placeholder="Buscar empleos por titulo, habilidad o empresa"
            />
            <button>
              Buscar
            </button>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
